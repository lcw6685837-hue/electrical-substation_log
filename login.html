<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNDOCHEM 수전일지 - 로그인</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <!-- 스타일 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="flex items-center justify-center gap-3 mb-6">
            <div class="bg-pink-500/20 p-2.5 rounded-xl border border-pink-500/50">
                <i class="fas fa-clipboard-list text-2xl text-pink-400"></i>
            </div>
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-rose-400 tracking-widest">수전일지(일일점검)</h1>
        </div>

        <form id="login-form" class="bg-[#0f172a] border border-slate-600 rounded-xl shadow-[0_0_20px_rgba(236,72,153,0.15)] p-8 flex flex-col gap-4">
            <h2 class="text-lg font-bold text-slate-200 text-center mb-2">로그인</h2>

            <div id="login-error" class="hidden text-sm font-bold text-rose-400 bg-rose-950/40 border border-rose-800 rounded-lg px-3 py-2 text-center"></div>

            <div class="flex flex-col gap-1.5">
                <label for="login-email" class="text-xs font-bold text-slate-400 tracking-wide">이메일</label>
                <input type="email" id="login-email" autocomplete="username" required
                    class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 outline-none focus:border-amber-400 transition"
                    placeholder="you@example.com">
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="login-password" class="text-xs font-bold text-slate-400 tracking-wide">비밀번호</label>
                <input type="password" id="login-password" autocomplete="current-password" required
                    class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 outline-none focus:border-amber-400 transition"
                    placeholder="••••••••">
            </div>

            <button type="submit" id="login-submit"
                class="mt-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
                로그인
            </button>

            <p class="text-xs text-slate-500 text-center mt-1">계정이 없으신가요? 관리자에게 문의해주세요.</p>
        </form>
    </div>

    <script src="firebase-config.js"></script>
    <script src="login.js"></script>
</body>
</html>
